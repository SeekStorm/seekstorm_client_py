[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "seekstorm-client-py"
version = "0.1.7"
description = "Python bindings for the SeekStorm REST client"
authors = [
    {name = "Wolf Garbe", email = "wolf.garbe@seekstorm.com"}
]
readme = "README.md" 
license = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython"
]