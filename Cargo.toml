[package]
name = "seekstorm_client_py"
version = "0.1.3"
edition = "2024"

[lib]
name = "seekstorm_client_py"
crate-type = ["cdylib"]

[dependencies]
# PyO3 bindings
pyo3 = { version = "0.29.0", features = ["extension-module", "experimental-async"] }

# Link the native seekstorm_client crate
seekstorm_client_rs =  { version = "3.3.2" } # , path = "../../seekstorm_rust_shard/seekstorm_client" 

# Async runtime
tokio = { version = "1", features = ["rt"] }

# Serialization helpers for python-to-rust objects if needed
serde_json = "1.0"

[workspace.lints.rust]
missing_docs = "warn"
unused_import_braces = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"

[profile.release]
lto = true
opt-level = 3
debug = false
debug-assertions = false
panic = "abort"
overflow-checks = false
strip = "debuginfo"
